<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Culturas HOSPESC — CCIH</title>
<meta name="description" content="CCIH HOSPESC — Busca de resultados de culturas e antibiogramas">
<meta name="theme-color" content="#0F6E56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Culturas HOSPESC">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f2;color:#1a1a1a;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:1.5rem 1rem}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
.hdr-left{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;background:#0F6E56;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:22px;height:22px;fill:white}
h1{font-size:18px;font-weight:700;color:#0F6E56}
.sub{font-size:12px;color:#999}
.btn-signout{background:none;border:1px solid #ddd;border-radius:7px;padding:6px 12px;font-size:12px;color:#666;cursor:pointer}
.btn-signout:hover{border-color:#bbb}
.card{background:white;border:1px solid #e5e5e5;border-radius:12px;padding:1.25rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.login-card{text-align:center;padding:3rem 1rem;max-width:420px;margin:4rem auto}
.login-card h2{font-size:16px;font-weight:600;color:#0F6E56;margin-bottom:.5rem}
.login-card p{font-size:13px;color:#999;margin-bottom:1.5rem;line-height:1.6}
.btn-google{display:inline-flex;align-items:center;gap:10px;background:#0F6E56;color:white;border:none;padding:12px 24px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
.btn-google:hover{opacity:.88}
.search-row{display:flex;gap:8px;flex-wrap:wrap}
.search-input{flex:1;min-width:140px;padding:10px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.search-input:focus{border-color:#0F6E56}
.search-btns{display:flex;gap:8px;flex-shrink:0}
.btn{padding:10px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-primary{background:#0F6E56;color:white}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:white;border:1.5px solid #ddd;color:#666}
.filters{display:flex;gap:8px;margin-top:.75rem;flex-wrap:wrap}
.sel{padding:6px 10px;border:1px solid #ddd;border-radius:7px;font-size:12px;background:#fafafa;color:#555;cursor:pointer;outline:none;flex:1;min-width:140px}
@media(max-width:480px){
  .hdr{gap:8px}
  h1{font-size:15px}
  .sub{font-size:11px}
  .btn-signout{padding:5px 9px;font-size:11px}
  .sel{min-width:120px}
}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:#bbb}
.btn-link{color:#0F6E56;background:none;border:none;cursor:pointer;text-decoration:underline;font-size:12px}
.stat-row{display:flex;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.stat{background:white;border:1px solid #e5e5e5;border-radius:8px;padding:.65rem 1rem}
.stat-n{font-size:24px;font-weight:700;color:#0F6E56;line-height:1}
.stat-l{font-size:11px;color:#999;margin-top:2px}
.pc{background:white;border:1px solid #e5e5e5;border-radius:12px;margin-bottom:.6rem;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.1rem;cursor:pointer;user-select:none}
.ph:hover{background:#f5fdf8}
.pname{font-size:14px;font-weight:700;color:#1a1a1a}
.pbadges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.p-cnt{background:#E1F5EE;color:#0F6E56}
.p-pos{background:#FFEBEB;color:#CC3333}
.chv{font-size:11px;color:#ccc;flex-shrink:0}
.clist{border-top:1px solid #f0f0f0}
.ci{padding:.85rem 1.1rem;border-bottom:1px solid #f5f5f5}
.ci:last-child{border-bottom:none}
.ci-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;gap:8px;flex-wrap:wrap}
.ci-nome{font-size:13px;font-weight:700;color:#222}
.tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px}
.tag-grupo{background:#E1F5EE;color:#0F6E56;font-weight:600}
.tag-leito{background:#f0f0f0;color:#666}
.tag-mes{background:#f0f0f0;color:#aaa;font-size:10px}
.meta{font-size:11px;color:#aaa;margin-bottom:5px;line-height:1.6}
.res-pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:6px;margin-bottom:4px;font-weight:600}
.res-pos{background:#FFEBEB;color:#CC3333}
.res-neg{background:#f0f0f0;color:#888}
.res-cont{background:#FFF3E0;color:#E65100}
.perf{display:inline-block;font-size:12px;padding:3px 10px;border-radius:6px;margin-bottom:4px;font-weight:600}
.perf-r{background:#FFEBEB;color:#990000}
.perf-s{background:#E8F5E9;color:#2E7D32}
.perf-i{background:#FFF3E0;color:#E65100}
.perf-n{background:#f0f0f0;color:#888}
.btn-pdf{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 11px;border-radius:7px;border:1.5px solid #0F6E56;color:#0F6E56;background:#E8F5F1;text-decoration:none;margin-top:4px}
.btn-pdf:hover{background:#C8EAE0}
.btn-pdf svg{width:13px;height:13px;fill:currentColor}
.welcome{text-align:center;padding:2.5rem 1rem;color:#999}
.welcome svg{width:48px;height:48px;fill:#cfcfcf;margin-bottom:1rem}
.welcome p{font-size:14px;line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:1.5rem;color:#888;font-size:13px}
.loading-row{display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border:2.5px solid #ddd;border-top-color:#0F6E56;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{font-size:11px;color:#bbb}
.empty{text-align:center;padding:3rem;color:#aaa;font-size:14px}
mark{background:#B2EDD7;border-radius:2px;padding:0 1px}
</style>
</head>
<body>

<div id="screen-login">
  <div class="login-card card">
    <div class="logo" style="margin:0 auto 1.25rem">
      <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm1 11H9V9h2v4zm0-6H9V5h2v2z"/></svg>
    </div>
    <h2>Culturas HOSPESC</h2>
    <p>Sistema da CCIH para busca de resultados<br>de culturas e antibiogramas.</p>
    <button class="btn-google" id="btn-login">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Entrar com Google
    </button>
    <div id="login-error" style="margin-top:1rem;font-size:12px;color:#CC3333;display:none"></div>
  </div>
</div>

<div id="screen-app" style="display:none">
  <div class="container">
    <div class="hdr">
      <div class="hdr-left">
        <div class="logo"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm1 11H9V9h2v4zm0-6H9V5h2v2z"/></svg></div>
        <div><h1>Culturas HOSPESC</h1><div class="sub">CCIH — Busca de resultados e antibiogramas</div></div>
      </div>
      <button class="btn-signout" id="btn-signout">Sair</button>
    </div>

    <div class="card">
      <div class="search-row">
        <input class="search-input" type="text" id="q" placeholder="Buscar por nome do paciente..." />
        <div class="search-btns">
          <button class="btn btn-primary" id="btn-buscar" disabled>Buscar</button>
          <button class="btn btn-secondary" id="btn-limpar">Limpar</button>
        </div>
      </div>
      <div class="filters">
        <select class="sel" id="f-mes"><option value="">Todos os meses</option></select>
        <select class="sel" id="f-setor">
          <option value="">Todos os setores</option>
          <option value="UTI">UTI</option>
          <option value="CM">CM</option>
          <option value="ENF">ENF</option>
          <option value="PS">PS</option>
          <option value="OUTRO">Outros</option>
        </select>
        <select class="sel" id="f-cult"><option value="">Todos os tipos de cultura</option></select>
        <select class="sel" id="f-res">
          <option value="">Todos os resultados</option>
          <option value="pos">Com crescimento</option>
          <option value="neg">Negativos</option>
          <option value="cont">Contaminados</option>
        </select>
      </div>
      <div class="info-bar">
        <span id="info-txt"></span>
        <button class="btn-link" id="btn-recarregar">Recarregar dados</button>
      </div>
    </div>

    <div id="stats" class="stat-row" style="display:none"></div>
    <div id="welcome" class="card welcome">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <p><strong>Pronto para buscar.</strong><br>Digite o nome do paciente ou use os filtros acima.</p>
    </div>
    <div id="loading" class="card" style="display:none">
      <div class="loading">
        <div class="loading-row"><div class="spin"></div><span id="loading-msg">Carregando...</span></div>
        <div class="prog" id="prog-txt"></div>
      </div>
    </div>
    <div id="results"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  var CLIENT_ID = '1049505493000-0alrjro7fhsdnlpgjrvv4djr3og1220f.apps.googleusercontent.com';
  var SHEET_ID  = '1yQHmd84BSlbAs7jb4ztN6fsy6eyZHY4wb6IcqOp0j7U';
  var SCOPES    = 'https://www.googleapis.com/auth/spreadsheets.readonly';
  var SHEETS = []; // preenchido dinamicamente pela API

  var token = null;
  var allData = [];
  var EXP = {};

  function el(id){ return document.getElementById(id); }
  function esc(s){
    if(s==null)return'';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function escRe(s){ return String(s).replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&'); }
  function hl(t,q){
    var safe=esc(t);
    if(!q||!t)return safe;
    try{return safe.replace(new RegExp('('+escRe(q)+')','gi'),'<mark>$1</mark>');}catch(e){return safe;}
  }

  window.addEventListener('load',function(){
    el('btn-login').addEventListener('click',doLogin);
    el('btn-signout').addEventListener('click',doSignout);
    el('btn-buscar').addEventListener('click',search);
    el('btn-limpar').addEventListener('click',limpar);
    el('btn-recarregar').addEventListener('click',recarregar);
    el('q').addEventListener('keydown',function(e){if(e.key==='Enter')search();});
    el('f-mes').addEventListener('change',search);
    el('f-setor').addEventListener('change',search);
    el('f-cult').addEventListener('change',search);
    el('f-res').addEventListener('change',search);
    var t   = sessionStorage.getItem('ccih_tok');
    var exp = parseInt(sessionStorage.getItem('ccih_exp') || '0');
    if(t && Date.now() < exp - 60000){
      // Token ainda válido — vai direto
      token = t;
      tokenExpiry = exp;
      showApp();
      loadData();
    } else if(t){
      // Token expirado — limpa e pede login novamente
      sessionStorage.removeItem('ccih_tok');
      sessionStorage.removeItem('ccih_exp');
    }
  });

  function doLogin(){
    el('btn-login').disabled=true;
    el('btn-login').textContent='Aguarde...';
    var c=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID, scope:SCOPES,
      callback:function(r){
        if(r.error){
          el('login-error').textContent='Erro de autenticacao. Tente novamente.';
          el('login-error').style.display='block';
          el('btn-login').disabled=false;
          el('btn-login').textContent='Entrar com Google';
          return;
        }
        token=r.access_token;
        tokenExpiry=Date.now()+((r.expires_in||3600)*1000);
        sessionStorage.setItem('ccih_tok',token);
        sessionStorage.setItem('ccih_exp',String(tokenExpiry));
        showApp();
        loadData();
      }
    });
    c.requestAccessToken();
  }

  function doSignout(){
    token=null;allData=[];EXP={};
    sessionStorage.removeItem('ccih_tok');
    sessionStorage.removeItem('ccih_exp');
    el('screen-app').style.display='none';
    el('screen-login').style.display='block';
  }

  function showApp(){
    el('screen-login').style.display='none';
    el('screen-app').style.display='block';
  }

  var tokenExpiry = 0;

  function apiFetch(url){
    return fetch(url,{headers:{Authorization:'Bearer '+token}})
      .then(function(r){
        if(r.status===401){ doSignout(); throw new Error('Sessao expirada. Faca login novamente.'); }
        return r.json();
      });
  }

  function normSetor(raw){
    if(!raw)return'OUTRO';
    var s=String(raw).toUpperCase().trim();
    if(s.indexOf('UTI')>=0)return'UTI';
    if(s.indexOf('ENF')>=0)return'ENF';
    if(s==='PS'||s.indexOf('PRONTO')>=0)return'PS';
    if(s.indexOf('CM')>=0)return'CM';
    return'OUTRO';
  }

  function detectCols(hdr){
    var m={};
    hdr.forEach(function(h,i){m[String(h||'').toLowerCase().trim()]=i;});
    function ex(k){return m[k]!==undefined?m[k]:-1;}
    function pt(ks){
      for(var i=0;i<hdr.length;i++){
        var h=String(hdr[i]||'').toLowerCase().trim();
        for(var j=0;j<ks.length;j++)if(h.indexOf(ks[j])>=0)return i;
      }return -1;
    }
    var idxRes=-1;
    for(var i=0;i<hdr.length;i++){
      var h=String(hdr[i]||'').toLowerCase().trim();
      if(h==='resultado'){idxRes=i;break;}
    }
    if(idxRes<0){
      for(var i=0;i<hdr.length;i++){
        var h=String(hdr[i]||'').toLowerCase().trim();
        if(h.indexOf('resultado')===0&&h.indexOf('contaminado')<0&&h.indexOf('final')<0&&h.indexOf('data')<0){idxRes=i;break;}
      }
    }
    return{
      dataRec: ex('data do recebimento')>=0?ex('data do recebimento'):pt(['recebimento']),
      dataRes: ex('data do resultado')>=0?ex('data do resultado'):pt(['data do resultado']),
      link:    ex('link\u00b4s exames')>=0?ex('link\u00b4s exames'):pt(['link']),
      pac:     ex('paciente')>=0?ex('paciente'):pt(['paciente']),
      setor:   ex('setor')>=0?ex('setor'):pt(['setor']),
      cult:    ex('cultura solicitada')>=0?ex('cultura solicitada'):pt(['cultura']),
      res:     idxRes,
      cont:    ex('resultado contaminado')>=0?ex('resultado contaminado'):pt(['contaminado']),
      perfil:  pt(['perfil','sensibilidade','senssibilidade']),
    };
  }

  function fmtD(v){
    if(!v)return'';
    var s=String(v);
    if(s.length>=10&&s.indexOf('-')===4)return s.substring(8,10)+'/'+s.substring(5,7)+'/'+s.substring(0,4);
    return s.substring(0,10);
  }

  function loadData(){
    allData=[];
    el('btn-buscar').disabled=true;
    el('welcome').style.display='none';
    el('loading').style.display='block';
    el('loading-msg').textContent='Buscando abas da planilha...';
    el('info-txt').textContent='Aguarde...';
    el('prog-txt').textContent='';

    // Primeiro busca a lista de abas via API
    apiFetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'?fields=sheets.properties.title')
      .then(function(d){
        var todas = (d.sheets || []).map(function(s){ return s.properties.title; });
        // Exclui a aba MODELO e qualquer aba que não seja de dados
        SHEETS = todas.filter(function(nm){
          return nm.toUpperCase() !== 'MODELO' && nm.trim() !== '';
        });
        el('prog-txt').textContent = 'Lendo ' + SHEETS.length + ' abas em paralelo...';
        startLoadPhase1();
      })
      .catch(function(err){
        el('loading-msg').textContent = 'Erro ao buscar abas: ' + err.message;
      });
  }

  function startLoadPhase1(){
    // Prioriza os 2 últimos meses — aparecem primeiro para o usuário
    var recentes = SHEETS.slice(-2);
    var antigas  = SHEETS.slice(0, -2);

    // ── CORREÇÃO 1: grava rowIndex (índice real da linha na planilha) ─────────
    // Isso permite que fetchChips correlacione cada chip ao registro correto
    // mesmo quando há linhas em branco intercaladas na planilha — o índice
    // sequencial antigo (dataIdx) desalinhava nessas situações, atribuindo
    // links de um paciente a outro.
    function fetchAba(nm){
      var rng = encodeURIComponent("'"+nm+"'!A1:V600");
      return apiFetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+rng+'?valueRenderOption=FORMATTED_VALUE')
        .then(function(d){
          var rows = d.values || [];
          var result = [];
          if(rows.length >= 3){
            var C = detectCols(rows[1]);
            for(var r=2; r<rows.length; r++){
              var row = rows[r];
              var pac = C.pac>=0  ? String(row[C.pac] ||'').trim() : '';
              var clt = C.cult>=0 ? String(row[C.cult]||'').trim() : '';
              if(!pac||!clt) continue;
              if(pac.toLowerCase()==='nan') continue;
              if(/^\d+$/.test(pac)) continue;
              if(pac.toUpperCase()==='PACIENTE') continue;
              var lt = C.link>=0 ? String(row[C.link]||'').trim() : '';
              var lu = lt.indexOf('http')===0 ? lt : '';
              var sr = C.setor>=0 ? String(row[C.setor]||'').trim() : '';
              result.push({
                mes:nm, paciente:pac, setorRaw:sr, setorGrupo:normSetor(sr), cultura:clt,
                dataRec:    C.dataRec>=0 ? fmtD(row[C.dataRec])               : '',
                dataRes:    C.dataRes>=0 ? fmtD(row[C.dataRes])               : '',
                resultado:  C.res>=0    ? String(row[C.res]   ||'').trim()    : '',
                contaminado:C.cont>=0   ? String(row[C.cont]  ||'').trim()    : '',
                perfil:     C.perfil>=0 ? String(row[C.perfil]||'').trim()    : '',
                linkUrl:lu, linkText:lt,
                rowIndex:r   // ← NOVO: índice real da linha para correlação exata com chips
              });
            }
          }
          return { nm:nm, rows:result };
        }).catch(function(){ return { nm:nm, rows:[] }; });
    }

    // ── CORREÇÃO 2: fetchChips por mapa rowIndex→registro ────────────────────
    // Substitui o índice sequencial (dataIdx++) pelo mapa byRow[r], que
    // correlaciona cada linha da resposta de chips com o registro correto
    // independente de linhas em branco. Antes, uma linha vazia na planilha
    // fazia dataIdx avançar, deslocando todos os chips seguintes e atribuindo
    // o link de um paciente ao registro do próximo na lista.
    function fetchChips(nm, abaDados){
      var rng = encodeURIComponent("'"+nm+"'!A1:V600");
      var url = 'https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID
        +'?ranges='+rng+'&fields=sheets(data(rowData(values(chipRuns(chip(richLinkProperties(uri)))))))';
      return apiFetch(url).then(function(d){
        try{
          var rowData = d.sheets[0].data[0].rowData || [];

          // Monta mapa rowIndex → registro para lookup O(1)
          var byRow = {};
          abaDados.forEach(function(reg){
            if(reg.rowIndex !== undefined) byRow[reg.rowIndex] = reg;
          });

          for(var r=0; r<rowData.length; r++){
            var reg = byRow[r];
            if(!reg) continue; // linha sem registro correspondente — pula
            var vals = (rowData[r] && rowData[r].values) || [];
            for(var c=0; c<vals.length; c++){
              var cell = vals[c];
              if(cell && cell.chipRuns){
                for(var i=0; i<cell.chipRuns.length; i++){
                  var cr = cell.chipRuns[i];
                  var u = cr&&cr.chip&&cr.chip.richLinkProperties&&cr.chip.richLinkProperties.uri;
                  if(u){ if(!reg.linkUrl) reg.linkUrl=u; break; }
                }
                break;
              }
            }
          }
        }catch(e){}
      }).catch(function(){});
    }

    // FASE 1a: carrega abas recentes primeiro e libera a busca
    el('loading-msg').textContent = 'Carregando meses recentes...';
    Promise.all(recentes.map(fetchAba)).then(function(results){
      results.forEach(function(res){ res.rows.forEach(function(r){ allData.push(r); }); });
      buildFilters();
      el('btn-buscar').disabled = false;
      el('loading').style.display = 'none';
      el('welcome').style.display = 'block';
      el('info-txt').textContent = allData.length + ' registros (carregando histórico...)';

      // FASE 1b: carrega abas antigas em background
      Promise.all(antigas.map(fetchAba)).then(function(results2){
        // Insere no início para manter ordem cronológica
        var novos = [];
        results2.forEach(function(res){ res.rows.forEach(function(r){ novos.push(r); }); });
        allData = novos.concat(allData);

        // Atualiza filtros com dados completos
        var fm=el('f-mes'); while(fm.options.length>1)fm.remove(1);
        var fc=el('f-cult'); while(fc.options.length>1)fc.remove(1);
        buildFilters();
        el('info-txt').textContent = allData.length + ' registros carregados. Carregando links...';

        // FASE 2: chips de todas as abas em background
        var todosChips = SHEETS.map(function(nm){
          var abaDados = allData.filter(function(r){ return r.mes===nm; });
          return fetchChips(nm, abaDados);
        });
        Promise.all(todosChips).then(function(){
          el('info-txt').textContent = allData.length + ' registros carregados';
        });
      });
    });
  }

  function buildFilters(){
    var fm=el('f-mes'); var mseen={};
    allData.forEach(function(r){if(!mseen[r.mes]){mseen[r.mes]=1;fm.appendChild(new Option(r.mes,r.mes));}});
    var fc=el('f-cult'); var cseen={}; var clist=[];
    allData.forEach(function(r){if(r.cultura&&!cseen[r.cultura]){cseen[r.cultura]=1;clist.push(r.cultura);}});
    clist.sort().forEach(function(v){fc.appendChild(new Option(v,v));});
  }

  function recarregar(){
    if(!confirm('Recarregar todos os dados?'))return;
    allData=[];EXP={};
    var fm=el('f-mes');while(fm.options.length>1)fm.remove(1);
    var fc=el('f-cult');while(fc.options.length>1)fc.remove(1);
    el('results').innerHTML='';
    el('stats').style.display='none';
    el('welcome').style.display='none';
    loadData();
  }

  function isPos(r){
    var v=String(r.resultado||'').toLowerCase();
    if(!v)return false;
    var neg=['negativa','contaminad','nova coleta','sem material','nao foi'];
    for(var i=0;i<neg.length;i++)if(v.indexOf(neg[i])>=0)return false;
    return true;
  }
  function rClass(v){
    var s=String(v||'').toLowerCase();
    if(s.indexOf('negativa')>=0)return'res-neg';
    if(s.indexOf('contaminad')>=0||s.indexOf('nova coleta')>=0||s.indexOf('sem material')>=0)return'res-cont';
    if(!s||s==='nan')return'res-neg';
    return'res-pos';
  }
  function pClass(v){
    var s=String(v||'').toLowerCase();
    if(!s||s==='nan')return'';
    if(s.indexOf('resistente')>=0)return'perf-r';
    if(s.indexOf('sensiv')>=0||s.indexOf('sens\u00edv')>=0)return'perf-s';
    if(s.indexOf('intermediar')>=0)return'perf-i';
    return'perf-n';
  }

  function search(){
    var q=el('q').value.trim();
    var mes=el('f-mes').value;
    var setor=el('f-setor').value;
    var cult=el('f-cult').value;
    var res=el('f-res').value;
    if(!q&&!mes&&!setor&&!cult&&!res){
      el('welcome').style.display='block';
      el('results').innerHTML='';
      el('stats').style.display='none';
      return;
    }
    var ql=q.toLowerCase();
    var filtered=allData.filter(function(r){
      if(q&&r.paciente.toLowerCase().indexOf(ql)<0)return false;
      if(mes&&r.mes!==mes)return false;
      if(setor&&r.setorGrupo!==setor)return false;
      if(cult&&r.cultura!==cult)return false;
      if(res){
        var v=(String(r.resultado||'')+' '+String(r.contaminado||'')).toLowerCase();
        if(res==='pos'&&(!v||v.indexOf('negativa')>=0||v.indexOf('contaminad')>=0||v.indexOf('nova coleta')>=0||v.indexOf('sem material')>=0))return false;
        if(res==='neg'&&v.indexOf('negativa')<0)return false;
        if(res==='cont'&&v.indexOf('contaminad')<0&&v.indexOf('nova coleta')<0)return false;
      }
      return true;
    });
    el('welcome').style.display='none';
    render(filtered,ql);
  }

  function limpar(){
    el('q').value='';
    ['f-mes','f-setor','f-cult','f-res'].forEach(function(id){el(id).value='';});
    EXP={};
    el('welcome').style.display='block';
    el('results').innerHTML='';
    el('stats').style.display='none';
  }

  function render(rows,q){
    var area=el('results'),stats=el('stats');
    if(!rows.length){area.innerHTML='<div class="empty">Nenhum resultado encontrado.</div>';stats.style.display='none';return;}
    var grouped={};
    rows.forEach(function(r){
      var k=r.paciente.trim().toUpperCase();
      if(!grouped[k])grouped[k]={name:r.paciente,rows:[]};
      grouped[k].rows.push(r);
    });
    var pats=Object.keys(grouped).sort();
    var posTotal=rows.filter(isPos).length;
    stats.style.display='flex';
    stats.innerHTML='<div class="stat"><div class="stat-n">'+pats.length+'</div><div class="stat-l">Paciente(s)</div></div>'
      +'<div class="stat"><div class="stat-n">'+rows.length+'</div><div class="stat-l">Cultura(s)</div></div>'
      +'<div class="stat"><div class="stat-n">'+posTotal+'</div><div class="stat-l">Com crescimento</div></div>';
    var html='';
    pats.forEach(function(pk){
      var g=grouped[pk],open=!!EXP[pk],posN=g.rows.filter(isPos).length;
      html+='<div class="pc"><div class="ph" data-pk="'+esc(pk)+'">'
        +'<span class="pname">'+hl(g.name,q)+'</span>'
        +'<div class="pbadges"><span class="pill p-cnt">'+g.rows.length+' cultura'+(g.rows.length>1?'s':'')+'</span>'
        +(posN?'<span class="pill p-pos">'+posN+' positiva'+(posN>1?'s':'')+'</span>':'')
        +'<span class="chv">'+(open?'▲':'▼')+'</span></div></div>';
      if(open){
        html+='<div class="clist">';
        g.rows.forEach(function(r){
          var res=String(r.resultado||'').trim();
          var perf=String(r.perfil||'').trim();
          var lu=String(r.linkUrl||'').trim();
          var lt=String(r.linkText||'').trim();
          var href=lu||(lt.indexOf('http')===0?lt:(lt?'https://drive.google.com/drive/search?q='+encodeURIComponent(lt):''));
          html+='<div class="ci"><div class="ci-top"><span class="ci-nome">'+esc(r.cultura)+'</span>'
            +'<div class="tags">'
            +(r.setorGrupo?'<span class="tag tag-grupo">'+esc(r.setorGrupo)+'</span>':'')
            +(r.setorRaw&&r.setorRaw!==r.setorGrupo?'<span class="tag tag-leito">'+esc(r.setorRaw)+'</span>':'')
            +'<span class="tag tag-mes">'+esc(r.mes)+'</span></div></div>'
            +'<div class="meta">'+(r.dataRec?'Coleta: <strong>'+esc(r.dataRec)+'</strong>':'')+(r.dataRes?' &middot; Resultado: <strong>'+esc(r.dataRes)+'</strong>':'')+'</div>'
            +(res&&res!=='nan'?'<div><span class="res-pill '+rClass(res)+'">'+esc(res)+'</span></div>':'')
            +(perf&&perf!=='nan'?'<div><span class="perf '+pClass(perf)+'">'+esc(perf)+'</span></div>':'')
            +(href?'<div><a class="btn-pdf" href="'+esc(href)+'" target="_blank" rel="noopener"><svg viewBox="0 0 20 20"><path d="M4 2h9l5 5v11H4V2zm9 0v5h5M7 10h6M7 13h4"/></svg> '+esc(lt||'Ver antibiograma')+'</a></div>':'')
            +'</div>';
        });
        html+='</div>';
      }
      html+='</div>';
    });
    area.innerHTML=html;
    var heads=area.querySelectorAll('.ph');
    for(var i=0;i<heads.length;i++){
      heads[i].addEventListener('click',function(){
        var pk=this.getAttribute('data-pk');
        EXP[pk]=!EXP[pk];search();
      });
    }
  }
})();
</script>
</body>
</html>
